name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys of this app at the same time
concurrency:
  group: deploy-geoscanner
  cancel-in-progress: false

env:
  APP_NAME: geoscanner
  APP_DIR: /var/www/apps/geoscanner
  KEEP_RELEASES: 5

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
          EOF

      # Upload into a fresh release dir, then atomically switch the "current" symlink
      - name: Upload release
        run: |
          RELEASE="$APP_DIR/releases/$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          ssh server "mkdir -p '$RELEASE'"
          rsync -az --delete dist/ "server:$RELEASE/"
          ssh server "ln -sfn '$RELEASE' '$APP_DIR/current.tmp' && mv -T '$APP_DIR/current.tmp' '$APP_DIR/current'"
          ssh server "cd '$APP_DIR/releases' && ls -1t | tail -n +$((KEEP_RELEASES + 1)) | xargs -r rm -rf"
